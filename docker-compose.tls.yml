# Merged by deploy.sh when TLS_DOMAIN is set.
# Usage: docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.tls.yml up -d

services:
  web:
    ports:
      - "0.0.0.0:${TLS_PORT:-443}:443"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h
        done
