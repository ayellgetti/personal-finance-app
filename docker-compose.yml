services:
  postgres:
    image: postgres:16-alpine
    container_name: docker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: example
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d example"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docker-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./apps/api/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: docker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: docker-redisinsight
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: docker-redis
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./apps/api/.env
    environment:
      # Local stack: keeps the OTP in the API response so signup is testable.
      # DATABASE_URL here overrides apps/api/.env so the API talks to the compose Postgres service.
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://example:example@postgres:5432/example
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: dev-only-access-secret
      JWT_REFRESH_SECRET: dev-only-refresh-secret
      OPENAI_TIMEOUT_MS: "90000"
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: docker-web
    restart: unless-stopped
    ports:
      - "5173:8080"
    environment:
      VITE_API_PROXY: http://api:5001
      VITE_DEV_POLLING: "1"
    volumes:
      # Source is bind mounted so edits hot reload without an image rebuild.
      # The anonymous volume keeps the image's Linux-built node_modules.
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  redisinsight_data:
