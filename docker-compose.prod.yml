# Production stack (built images, no Vite bind mounts).
# Run with: docker compose -p personal-finance-prod --env-file .env.prod -f docker-compose.prod.yml
# Do not start this file while docker-compose.dev.yml holds ports 80/443.
# See docs/AWS_DEPLOY.md.

x-api-healthcheck: &api-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:5001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
    ]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-crm-prod-healthcheck: &crm-prod-healthcheck
  test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  nginx:
    image: nginx:latest
    container_name: docker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./containers/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./containers/nginx/ssl:/etc/nginx/ssl:ro
      - ./containers/certbot/letsencrypt:/etc/letsencrypt
      - ./containers/certbot/www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      api-travel:
        condition: service_healthy
      api-banque:
        condition: service_healthy
      web:
        condition: service_healthy
      website:
        condition: service_healthy
      crm:
        condition: service_healthy
      travel-crm:
        condition: service_healthy
      banque-crm:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./containers/certbot/letsencrypt:/etc/letsencrypt
      - ./containers/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew \
            --webroot \
            -w /var/www/certbot \
            --quiet

          sleep 12h
        done
    depends_on:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: docker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./containers/postgres/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-init-crm-dbs:
    image: postgres:16-alpine
    container_name: docker-postgres-init-crm-dbs
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TRAVEL_CRM_DB: ${POSTGRES_TRAVEL_CRM_DB}
      POSTGRES_BANQUE_CRM_DB: ${POSTGRES_BANQUE_CRM_DB}
    volumes:
      - ./containers/postgres/init-crm-databases.sh:/init-crm-databases.sh:ro
    command: ["sh", "/init-crm-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docker-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./apps/api/servers.json:/pgadmin4/servers.json:ro
      - ./containers/postgres/pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: docker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./containers/redis/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: docker-redisinsight
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: ${REDIS_HOST} 
      RI_REDIS_PORT: ${REDIS_PORT}
      RI_REDIS_ALIAS: docker-redis
    ports:
      - "5540:5540"
    volumes:
      - ./containers/redis/redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck

  api-travel:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api-travel
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_TRAVEL_CRM_DB}
      REDIS_URL: redis://redis:6379/1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}-travel
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}-travel
      CORS_ORIGIN: ${TRAVEL_CRM_ORIGIN:-https://travel.myfinancefreedom.com}
    depends_on:
      postgres-init-crm-dbs:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      start_period: 60s

  api-banque:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api-banque
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_BANQUE_CRM_DB}
      REDIS_URL: redis://redis:6379/2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}-banque
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}-banque
      CORS_ORIGIN: ${BANQUE_CRM_ORIGIN:-https://banquet.myfinancefreedom.com}
    depends_on:
      postgres-init-crm-dbs:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: docker-web
    restart: unless-stopped
    env_file:
      - ./.env.prod
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile.prod
      args:
        VITE_APP_URL: ${VITE_APP_URL:-https://web.myfinancefreedom.com}
    container_name: docker-website
    restart: unless-stopped
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile.prod
    container_name: docker-crm
    restart: unless-stopped
    env_file:
      - ./.env.prod
    ports:
      - "8082:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *crm-prod-healthcheck

  travel-crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile.prod
    container_name: docker-travel-crm
    restart: unless-stopped
    env_file:
      - ./.env.prod
    ports:
      - "8083:80"
    depends_on:
      api-travel:
        condition: service_healthy
    healthcheck: *crm-prod-healthcheck

  banque-crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile.prod
    container_name: docker-banque-crm
    restart: unless-stopped
    env_file:
      - ./.env.prod
    ports:
      - "8084:80"
    depends_on:
      api-banque:
        condition: service_healthy
    healthcheck: *crm-prod-healthcheck
