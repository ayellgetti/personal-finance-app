# Local development stack (Vite on 5173, bind mounts, admin UIs).
# nginx also fronts the stack on http://localhost so /api is same-origin.
# AWS / public hosts: docker-compose.prod.yml — see docs/AWS_DEPLOY.md.

services:
  nginx:
    image: nginx:latest
    container_name: docker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # conf.d, not nginx.conf: these files are server blocks, not a main config.
      # nginx.dev.conf proxies to Vite; nginx.conf serves a built dist in prod.
      # - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/snippets:/etc/nginx/snippets:ro
      - ./containers/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./containers/nginx/ssl:/etc/nginx/ssl:ro
      - ./containers/certbot/letsencrypt:/etc/letsencrypt
      - ./containers/certbot/www:/var/www/certbot
      - ./apps/web/dist:/usr/share/nginx/html
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./containers/certbot/letsencrypt:/etc/letsencrypt
      - ./containers/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew \
            --webroot \
            -w /var/www/certbot \
            --quiet

          sleep 12h
        done
    depends_on:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: docker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./containers/postgres/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docker-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./apps/api/servers.json:/pgadmin4/servers.json:ro
      - ./containers/postgres/pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: docker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./containers/redis/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: docker-redisinsight
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: ${REDIS_HOST} 
      RI_REDIS_PORT: ${REDIS_PORT}
      RI_REDIS_ALIAS: docker-redis
    ports:
      - "5540:5540"
    volumes:
      - ./containers/redis/redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: docker-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Source is bind mounted so edits hot reload without an image rebuild.
      # The anonymous volume keeps the image's Linux-built node_modules.
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

