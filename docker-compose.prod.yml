services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # API
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # NGINX
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./containers/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Let's Encrypt certificates
      - ./containers/certbot/letsencrypt:/etc/letsencrypt:ro

      # ACME challenge
      - ./containers/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy

  # ============================================================
  # CERTBOT
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      # Certificates stored directly on host
      - ./containers/certbot/letsencrypt:/etc/letsencrypt

      # ACME challenge files
      - ./containers/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM

        while :; do
          certbot renew \
            --webroot \
            -w /var/www/certbot \
            --quiet

          sleep 12h
        done

volumes:
  postgres_data: