# AWS / production Compose.
# Local development stays in docker-compose.yml.
#
# Usage:
# docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Public surface is the web image (nginx + built SPA + /api proxy).
# Postgres, Redis, and API stay on the internal Compose network.
#
# TLS / Certbot:
# - web exposes HTTP/HTTPS
# - Certbot uses the same ACME webroot as web
# - Certificates are stored in ./containers/certbot/letsencrypt
#
# Do not add a second nginx service.
# The web image already contains nginx.

name: personal-finance-prod

services:

  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5


  # ============================================================
  # API
  # ============================================================

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      PORT: 5001

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      CORS_ORIGIN: ${PUBLIC_ORIGIN}

      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ============================================================
  # WEB
  #
  # Nginx + React SPA + /api proxy
  # ============================================================

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod

    restart: unless-stopped

    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      TLS_WWW_DOMAIN: ${TLS_WWW_DOMAIN:-}

    volumes:

      # Let's Encrypt certificates
      #
      # Host:
      # ./containers/certbot/letsencrypt
      #
      # Container:
      # /etc/letsencrypt
      #
      - ./containers/certbot/letsencrypt:/etc/letsencrypt:ro

      # Let's Encrypt ACME challenge
      #
      # Must be shared with certbot.
      #
      - ./containers/certbot/www:/var/www/certbot

    ports:

      # HTTP
      - "0.0.0.0:${PUBLIC_PORT:-80}:80"

      # HTTPS
      - "0.0.0.0:${HTTPS_PORT:-443}:443"

    depends_on:
      api:
        condition: service_healthy


  # ============================================================
  # CERTBOT
  #
  # Only responsible for obtaining/renewing certificates.
  # Nginx/web remains the public-facing service.
  # ============================================================

  certbot:
    image: certbot/certbot:latest

    restart: unless-stopped

    volumes:

      # Certificates are persisted on the host.
      - ./containers/certbot/letsencrypt:/etc/letsencrypt

      # ACME challenge files are shared with web.
      - ./containers/certbot/www:/var/www/certbot

    entrypoint: /bin/sh

    command:
      - -c
      - |
        trap exit TERM

        while :; do
          certbot renew \
            --webroot \
            -w /var/www/certbot \
            --quiet

          sleep 12h
        done

    depends_on:
      - web


# ================================================================
# NAMED VOLUMES
# ================================================================

volumes:
  postgres_data:
  redis_data: