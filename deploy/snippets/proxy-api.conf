# $request_uri is required because proxy_pass with a variable does not rewrite
# the path. $api_host and the resolver are declared in the server block.
proxy_pass http://$api_host:5001$request_uri;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
# Advisor generation waits on OpenAI (OPENAI_TIMEOUT_MS, 90s default).
proxy_read_timeout 120s;
