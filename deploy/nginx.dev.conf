# Local development front door: nginx on http://localhost.
# Production serves the built dist with deploy/nginx.conf — see docs/AWS_DEPLOY.md.

# Vite's HMR client opens a websocket, so Connection must mirror the Upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Statement uploads are capped by UPLOAD_MAX_FILE_SIZE_BYTES (5 MiB default);
    # leave headroom for multipart overhead.
    client_max_body_size 10m;

    # Docker's embedded DNS, re-resolved so a rebuilt api or web container (new
    # IP) does not leave nginx proxying to a dead address until it is reloaded.
    # Requires the variables in proxy_pass below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;
    set $web_host web;

    location ^~ /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /health {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Everything else is the Vite dev server: unbuilt modules, /@vite/client,
    # and the HMR websocket. No caching headers here; Vite sets its own.
    location / {
        proxy_pass http://$web_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
