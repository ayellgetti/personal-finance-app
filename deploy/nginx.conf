server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Statement uploads are capped by UPLOAD_MAX_FILE_SIZE_BYTES (5 MiB default);
    # leave headroom for multipart overhead.
    client_max_body_size 10m;

    # Docker's embedded DNS, re-resolved so a rebuilt api container (new IP) does
    # not leave nginx proxying to a dead address until it is reloaded. Requires
    # the variable in proxy_pass below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;

    # Express also mounts /docs, /docs.json, and /planner(.html) from
    # apps/api/public. Those stay unreachable from the internet on purpose; the
    # React app does not use them. Reach them over an SSH tunnel to port 5001.
    location ^~ /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /health {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Hashed filenames from vite build: safe to cache permanently.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # SPA entry point plus unhashed public files (favicon, robots.txt). index.html
    # must never be cached or browsers keep loading the previous deploy's assets.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
