server {
    listen 80;
    server_name __TLS_DOMAIN__ __TLS_WWW_DOMAIN__ _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Statement uploads are capped by UPLOAD_MAX_FILE_SIZE_BYTES (5 MiB default);
    # leave headroom for multipart overhead.
    client_max_body_size 10m;

    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
