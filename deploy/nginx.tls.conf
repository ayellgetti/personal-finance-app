# HTTP: ACME + health (container healthcheck) + redirect everything else to HTTPS.
server {
    listen 80;
    server_name __TLS_DOMAIN__ __TLS_WWW_DOMAIN__;
    server_tokens off;

    include /etc/nginx/snippets/acme.conf;

    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location / {
        return 301 https://__TLS_DOMAIN__$request_uri;
    }
}

# Canonical host.
server {
    listen 443 ssl;
    http2 on;
    server_name __TLS_DOMAIN__;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__TLS_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TLS_DOMAIN__/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 10m;

    include /etc/nginx/snippets/app-locations.conf;
}

# www → apex so CORS_ORIGIN / PUBLIC_ORIGIN stay a single URL.
server {
    listen 443 ssl;
    http2 on;
    server_name __TLS_WWW_DOMAIN__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__TLS_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TLS_DOMAIN__/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://__TLS_DOMAIN__$request_uri;
}
