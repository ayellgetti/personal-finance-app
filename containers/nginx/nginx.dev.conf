# Main nginx config (mounted at /etc/nginx/nginx.conf).
# Host map:
#   api.local.uat              → Express (apps/api)
#   web.local.uat              → product SPA (apps/web); /api and /health still
#                                proxied so the SPA's same-origin fetches work
#   local.uat, www.local.uat   → marketing site (apps/website)
#   default / localhost        → marketing site

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # Vite HMR websocket: Connection must mirror the Upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker DNS; re-resolve so a rebuilt api/web container is not pinned
    # to a stale IP. Variables in proxy_pass are required for this.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API: http://api.local.uat ---
    server {
        listen 80;
        listen [::]:80;
        server_name api.local.uat;

        set $api_host api;

        location / {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }

    # --- Product app: http://web.local.uat ---
    server {
        listen 80;
        listen [::]:80;
        server_name web.local.uat;

        set $api_host api;
        set $web_host web;

        location = /api/health {
            rewrite ^ /health break;
            proxy_pass http://$api_host:5001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ^~ /api/ {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Vite: unbuilt modules, /@vite/client, and the HMR websocket.
        location / {
            proxy_pass http://$web_host:8080$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # --- Marketing site: http://local.uat and http://www.local.uat ---
    server {
        listen 80;
        listen [::]:80;
        server_name local.uat www.local.uat website.local.uat _;

        set $website_host website;

        location / {
            proxy_pass http://$website_host:8081$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
