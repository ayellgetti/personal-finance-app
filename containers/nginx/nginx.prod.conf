# Edge proxy: HTTP (ACME + health + redirect) and HTTPS by hostname.
# Host map (HTTPS):
#   api.myfinancefreedom.com              → Express (apps/api)
#   web.myfinancefreedom.com              → product SPA (apps/web); /api and
#                                            /health still proxied for same-origin
#   crm.myfinancefreedom.com              → Sales CRM SPA (apps/crm); /api and
#                                            /health still proxied for same-origin
#   myfinancefreedom.com, www.…           → marketing site (apps/website)
#
# Do not put listen 80 and listen 443 ssl in the same server — nginx
# refuses to start if the certificate files are missing, which also
# kills HTTP and blocks certbot from issuing the first cert.
# TLS cert must include api., web., crm., www, and the apex name.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- HTTP: issue/renew certs, keep liveness, send browsers to HTTPS ---
    server {
        listen 80;
        listen [::]:80;
        server_name myfinancefreedom.com www.myfinancefreedom.com web.myfinancefreedom.com crm.myfinancefreedom.com api.myfinancefreedom.com _;

        set $api_host api;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location = /api/health {
            rewrite ^ /health break;
            proxy_pass http://$api_host:5001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS API ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.myfinancefreedom.com;

        ssl_certificate /etc/letsencrypt/live/myfinancefreedom.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myfinancefreedom.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        set $api_host api;

        # Keep Swagger and planner HTML off the public internet (same as
        # the previous path-only /api proxy). Use an SSH tunnel to :5001.
        location ^~ /docs {
            return 404;
        }

        location = /docs.json {
            return 404;
        }

        location = /planner {
            return 404;
        }

        location = /planner.html {
            return 404;
        }

        location / {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }

    # --- HTTPS product app ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name web.myfinancefreedom.com;

        ssl_certificate /etc/letsencrypt/live/myfinancefreedom.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myfinancefreedom.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        set $api_host api;
        set $web_host web;

        location = /api/health {
            rewrite ^ /health break;
            proxy_pass http://$api_host:5001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ^~ /api/ {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://$web_host:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # --- HTTPS Sales CRM ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name crm.myfinancefreedom.com;

        ssl_certificate /etc/letsencrypt/live/myfinancefreedom.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myfinancefreedom.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        set $api_host api;
        set $crm_host crm;

        location = /api/health {
            rewrite ^ /health break;
            proxy_pass http://$api_host:5001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ^~ /api/ {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://$crm_host:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # --- HTTPS marketing site ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name myfinancefreedom.com www.myfinancefreedom.com;

        ssl_certificate /etc/letsencrypt/live/myfinancefreedom.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myfinancefreedom.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        set $website_host website;

        location / {
            proxy_pass http://$website_host:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
