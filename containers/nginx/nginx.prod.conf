# Main nginx config (mounted at /etc/nginx/nginx.conf).
# Reverse-proxies Vite on web:8080 and Express on api:5001.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # Vite HMR websocket: Connection must mirror the Upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker DNS; re-resolve so a rebuilt api/web container is not pinned
    # to a stale IP. Variables in proxy_pass are required for this.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name web.local.uat _;

        set $api_host api;
        set $web_host web;

        location = /api/health {
            rewrite ^ /health break;
            proxy_pass http://$api_host:5001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location ^~ /api/ {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://$api_host:5001$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Vite: unbuilt modules, /@vite/client, and the HMR websocket.
        location / {
            proxy_pass http://$web_host:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        
    }
}
