# Static SPA for the website container (marketing site).

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The document and the cleanup worker must revalidate. A cached
        # index.html, or an HTML body at /sw.js, leaves the old app on screen.
        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /sw.js {
            add_header Cache-Control "no-cache";
            default_type application/javascript;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
