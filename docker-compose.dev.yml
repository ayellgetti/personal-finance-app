# Local development stack (Vite on 5173, bind mounts, admin UIs).
# nginx also fronts the stack on http://localhost so /api is same-origin.
# AWS / public hosts: docker-compose.prod.yml — see docs/AWS_DEPLOY.md.
#
# Three CRM businesses share the apps/crm UI and apps/api image, but not data:
#   myfinancefreedomcrm → api          → Postgres ${POSTGRES_DB} (also finance)
#   travel-crm           → api-travel   → Postgres ${POSTGRES_TRAVEL_CRM_DB}
#   banque-crm           → api-banque   → Postgres ${POSTGRES_BANQUE_CRM_DB}
# Do not copy apps/crm or add tenantId; isolation is a second API process + database.

x-api-healthcheck: &api-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:5001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
    ]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-crm-healthcheck: &crm-healthcheck
  test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  nginx:
    image: nginx:latest
    container_name: docker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # conf.d, not nginx.conf: these files are server blocks, not a main config.
      # nginx.dev.conf proxies to Vite; nginx.conf serves a built dist in prod.
      # - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/snippets:/etc/nginx/snippets:ro
      - ./containers/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./containers/nginx/ssl:/etc/nginx/ssl:ro
      - ./containers/certbot/letsencrypt:/etc/letsencrypt
      - ./containers/certbot/www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      api-travel:
        condition: service_healthy
      api-banque:
        condition: service_healthy
      web:
        condition: service_healthy
      website:
        condition: service_healthy
      myfinancefreedomcrm:
        condition: service_healthy
      travel-crm:
        condition: service_healthy
      banque-crm:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: docker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./containers/postgres/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-init-crm-dbs:
    image: postgres:16-alpine
    container_name: docker-postgres-init-crm-dbs
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TRAVEL_CRM_DB: ${POSTGRES_TRAVEL_CRM_DB}
      POSTGRES_BANQUE_CRM_DB: ${POSTGRES_BANQUE_CRM_DB}
    volumes:
      - ./containers/postgres/init-crm-databases.sh:/init-crm-databases.sh:ro
    command: ["sh", "/init-crm-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docker-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./apps/api/servers.json:/pgadmin4/servers.json:ro
      - ./containers/postgres/pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: docker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./containers/redis/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: docker-redisinsight
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: ${REDIS_HOST} 
      RI_REDIS_PORT: ${REDIS_PORT}
      RI_REDIS_ALIAS: docker-redis
    ports:
      - "5540:5540"
    volumes:
      - ./containers/redis/redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *api-healthcheck

  api-travel:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api-travel
    restart: unless-stopped
    ports:
      - "5002:5001"
    env_file:
      - ./.env.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_TRAVEL_CRM_DB}
      REDIS_URL: redis://redis:6379/1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}-travel
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}-travel
      CORS_ORIGIN: http://travel.local.uat
    depends_on:
      postgres-init-crm-dbs:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      start_period: 60s

  api-banque:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docker-api-banque
    restart: unless-stopped
    ports:
      - "5003:5001"
    env_file:
      - ./.env.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_BANQUE_CRM_DB}
      REDIS_URL: redis://redis:6379/2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}-banque
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}-banque
      CORS_ORIGIN: http://banquet.local.uat
    depends_on:
      postgres-init-crm-dbs:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: docker-web
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      # Vite reads process.env at startup. Do not default VITE_OTP_AUTO_VERIFY
      # here — Compose interpolation would force false unless --env-file is used,
      # and that overwrites the value from env_file.
      VITE_API_PROXY: ${VITE_API_PROXY:-http://api:5001}
    ports:
      - "8080:8080"
    volumes:
      # Source is bind mounted so edits hot reload without an image rebuild.
      # The anonymous volume keeps the image's Linux-built node_modules.
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    container_name: docker-website
    restart: unless-stopped
    environment:
      VITE_APP_URL: ${VITE_APP_URL:-http://web.local.uat}
      VITE_DEV_ALLOWED_HOSTS: ${VITE_DEV_ALLOWED_HOSTS:-local.uat,www.local.uat,website.local.uat,web.local.uat,localhost}
      VITE_DEV_POLLING: ${VITE_DEV_POLLING:-}
    ports:
      - "8081:8081"
    volumes:
      - ./apps/website:/app/apps/website
      - /app/apps/website/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  myfinancefreedomcrm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
    container_name: docker-crm
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      VITE_API_PROXY: http://api:5001
      VITE_DEV_ALLOWED_HOSTS: ${VITE_CRM_DEV_ALLOWED_HOSTS:-crm.local.uat,localhost}
      VITE_DEV_POLLING: ${VITE_DEV_POLLING:-}
    ports:
      - "8082:8082"
    volumes:
      - ./apps/crm:/app/apps/crm
      - /app/apps/crm/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *crm-healthcheck

  travel-crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
    container_name: docker-travel-crm
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      VITE_API_PROXY: http://api-travel:5001
      VITE_DEV_ALLOWED_HOSTS: ${VITE_TRAVEL_CRM_DEV_ALLOWED_HOSTS:-travel.local.uat,localhost}
      VITE_DEV_POLLING: ${VITE_DEV_POLLING:-}
    ports:
      - "8083:8082"
    volumes:
      - ./apps/crm:/app/apps/crm
      - /app/apps/crm/node_modules
    depends_on:
      api-travel:
        condition: service_healthy
    healthcheck: *crm-healthcheck

  banque-crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
    container_name: docker-banque-crm
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      VITE_API_PROXY: http://api-banque:5001
      VITE_DEV_ALLOWED_HOSTS: ${VITE_BANQUE_CRM_DEV_ALLOWED_HOSTS:-banquet.local.uat,localhost}
      VITE_DEV_POLLING: ${VITE_DEV_POLLING:-}
    ports:
      - "8084:8082"
    volumes:
      - ./apps/crm:/app/apps/crm
      - /app/apps/crm/node_modules
    depends_on:
      api-banque:
        condition: service_healthy
    healthcheck: *crm-healthcheck
