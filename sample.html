<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Day Manager - Handover Checklist</title>
<!-- Bootstrap 5 -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
<style>
    @page {
        size: A4 portrait;
        margin: 6mm;
    }
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        background: #f2f2f2;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 8px;
    }
    .page {
        width: 100%;
        max-width: 210mm;
        margin: auto;
        background: #fff;
        padding: 8px;
    }
    /* =========================
       HEADER
    ========================= */
    .title {
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 1px;
    }
    .subtitle {
        text-align: center;
        color: #666;
        font-size: 7px;
        margin-bottom: 5px;
    }
    /* =========================
       EVENT INFORMATION
    ========================= */
    .event-info {
        border: 1px solid #333;
        margin-bottom: 5px;
    }
    .info-box {
        border-right: 1px solid #333;
    }
    .info-box:last-child {
        border-right: 0;
    }
    .info-label {
        display: block;
        background: #e9e9e9;
        border-bottom: 1px solid #333;
        padding: 2px 4px;
        font-size: 7px;
        font-weight: 700;
        text-transform: uppercase;
    }
    /* =========================
       FORM ELEMENTS
    ========================= */
    .form-control,
    .form-select {
        min-height: 18px;
        height: 18px;
        padding: 1px 4px;
        border-radius: 0;
        border: 0;
        box-shadow: none !important;
        background: transparent;
        font-size: 8px;
    }
    .form-select {
        padding-right: 22px;
    }
    .form-control:focus,
    .form-select:focus,
    textarea:focus {
        border-color: transparent;
        outline: none;
    }
    /* =========================
       CHECKLIST TABLE
    ========================= */
    .checklist-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }
    .checklist-table th {
        background: #dedede;
        border: 1px solid #222;
        padding: 3px;
        text-align: center;
        font-size: 7px;
        text-transform: uppercase;
    }
    .checklist-table td {
        border: 1px solid #333;
        vertical-align: middle;
        padding: 0;
    }
    .category-column {
        width: 16%;
    }
    .details-column {
        width: 76%;
    }
    .ready-column {
        width: 8%;
    }
    .category {
        text-align: center;
        font-size: 8px;
        font-weight: 700;
        background: #f0f0f0;
        padding: 3px !important;
    }
    /* =========================
       ITEM ROW
    ========================= */
    .items-container {
        padding: 0;
    }
    .item-row {
        display: grid;
        grid-template-columns: 4% 38% 12% 41% 5%;
        align-items: center;
        min-height: 19px;
        border-bottom: 1px dotted #aaa;
    }
    .item-row:last-child {
        border-bottom: 0;
    }
    .item-number {
        text-align: center;
        font-size: 7px;
        font-weight: 700;
    }
    .item-field {
        border-right: 1px dotted #aaa;
    }
    .item-qty {
        border-right: 1px dotted #aaa;
    }
    .item-requirement {
        border-right: 1px dotted #aaa;
    }
    .remove-item {
        border: 0;
        background: transparent;
        color: #b00020;
        font-size: 11px;
        padding: 0;
        cursor: pointer;
    }
    .remove-item:hover {
        color: #700014;
    }
    /* =========================
       ADD ITEM
    ========================= */
    .add-item-row {
        padding: 2px 5px;
        border-top: 1px dotted #aaa;
        text-align: right;
    }
    .add-item-btn {
        font-size: 7px;
        padding: 1px 5px;
        line-height: 14px;
    }
    .max-note {
        color: #777;
        font-size: 6.5px;
        margin-left: 5px;
    }
    /* =========================
       READY CHECKBOX
    ========================= */
    .ready-cell {
        text-align: center;
    }
    .ready-checkbox {
        width: 12px;
        height: 12px;
        margin: 0;
        cursor: pointer;
    }
    /* =========================
       DECORATION
    ========================= */
    .decoration-cell {
        padding: 4px !important;
        background: #fafafa;
    }
    .decoration-textarea {
        width: 100%;
        height: 65px !important;
        min-height: 65px;
        border: 0 !important;
        resize: none;
        padding: 3px 5px !important;
        font-size: 8px;
    }
    .decoration-help {
        font-size: 6.5px;
        color: #777;
        padding: 0 4px 3px;
    }
    /* =========================
       FOOTER
    ========================= */
    .footer-section {
        margin-top: 5px;
    }
    .footer-box {
        border: 1px solid #333;
    }
    .footer-title {
        background: #e9e9e9;
        border-bottom: 1px solid #333;
        padding: 2px 4px;
        font-size: 7px;
        font-weight: 700;
        text-transform: uppercase;
    }
    .remarks {
        width: 100%;
        height: 30px !important;
        min-height: 30px;
        resize: none;
        padding: 3px 4px !important;
    }
    .signature {
        height: 30px !important;
    }
    /* =========================
       SCREEN
    ========================= */
    @media screen {
        body {
            padding: 15px;
        }
        .page {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }
    }
    /* =========================
       PRINT
    ========================= */
    @media print {
        body {
            background: #fff !important;
            padding: 0;
        }
        .page {
            max-width: none;
            padding: 0;
            box-shadow: none;
        }
        .no-print {
            display: none !important;
        }
        input,
        select,
        textarea {
            color: #000 !important;
            -webkit-text-fill-color: #000 !important;
        }
        input::placeholder,
        textarea::placeholder {
            color: #777 !important;
            opacity: 1;
        }
        .checklist-table tr {
            page-break-inside: avoid;
        }
        .form-select {
            appearance: auto;
            -webkit-appearance: auto;
        }
    }
</style>
</head>
<body>
<div class="page">
<!-- =========================
     HEADER
========================= -->
<div class="title">
    EVENT DAY MANAGER – FINAL HANDOVER CHECKLIST
</div>
<div class="subtitle">
    Final checklist to be handed over to the Event Day Manager
</div>
<!-- =========================
     EVENT INFORMATION
========================= -->
<div class="event-info">
    <div class="row g-0">
        <div class="col-3 info-box">
            <span class="info-label">Event Date</span>
            <input
                type="date"
                class="form-control"
                id="eventDate"
            >
        </div>
        <div class="col-3 info-box">
            <span class="info-label">Client / Event</span>
            <input
                type="text"
                class="form-control"
                placeholder="Client / Event"
            >
        </div>
        <div class="col-3 info-box">
            <span class="info-label">Expected Guests</span>
            <input
                type="number"
                class="form-control"
                placeholder="Guests"
            >
        </div>
        <div class="col-3 info-box">
            <span class="info-label">Event Time</span>
            <input
                type="text"
                class="form-control"
                placeholder="Time"
            >
        </div>
    </div>
</div>
<!-- =========================
     MAIN CHECKLIST
========================= -->
<table class="checklist-table">
    <thead>
        <tr>
            <th class="category-column">Category</th>
            <th class="details-column">
                Item / Quantity / Requirements
            </th>
            <th class="ready-column">Ready</th>
        </tr>
    </thead>
    <tbody id="checklistBody"></tbody>
</table>
<!-- =========================
     FOOTER
========================= -->
<div class="footer-section">
    <div class="row g-1">
        <div class="col-9">
            <div class="footer-box">
                <div class="footer-title">
                    Manager Remarks
                </div>
                <textarea
                    class="form-control remarks"
                    placeholder="Special instructions, pending items, client requirements..."
                ></textarea>
            </div>
        </div>
        <div class="col-3">
            <div class="footer-box">
                <div class="footer-title">
                    Manager Signature
                </div>
                <input
                    type="text"
                    class="form-control signature"
                    placeholder="Signature"
                >
            </div>
        </div>
    </div>
</div>
<!-- =========================
     ACTION BUTTONS
========================= -->
<div class="text-center mt-2 no-print">
    <button
        type="button"
        class="btn btn-dark btn-sm me-1"
        onclick="window.print()"
    >
        Print Checklist
    </button>
    <button
        type="button"
        class="btn btn-outline-secondary btn-sm"
        onclick="resetChecklist()"
    >
        Reset
    </button>
</div>
</div>
<script>
    /* ============================================================
       MENU CATALOGUE
       Replace these arrays with the exact items from your
       Banquet Manager menu catalogue.
    ============================================================ */
    const menuCatalogue = {
        "WELCOME DRINK": [
            "Fresh Lime Water",

            "Aam Panna",

        ],
        "DAL": [

        ],
        "FARSAN": [
            "Khaman",
            "Dhokla",
            "Patra",
            "Samosa",
            "Kachori",
            "Batata Vada",
            "Alu Tikki",
            "Methi Gota"
        ],
        "SWEET / ICE CREAM": [
            "Gulab Jamun",
            "Rasgulla",
            "Jalebi",
            "Shrikhand",
            "Basundi",
            "Gajar Halwa",
            "Moong Dal Halwa",
            "Ice Cream",
            "Kulfi",
            "Fruit Custard"
        ],
        "RAITA / SALAD": [
            "Boondi Raita",
            "Pineapple Raita",
            "Vegetable Raita",
            "Cucumber Raita",
            "Green Salad",
            "Russian Salad",
            "Sprouts Salad",
            "Kachumber Salad"
        ],
        "LIVE COUNTER": [
            "Pani Puri",
            "Dosa",
            "Pav Bhaji",
            "Chaat",
            "Pasta",
            "Pizza",
            "Chinese Noodles",
            "Manchurian",
            "Tawa Pulav",
            "Sandwich"
        ]
    };
    /* ============================================================
       CATEGORY CONFIGURATION
    ============================================================ */
    const categories = [
        {
            name: "WELCOME DRINK",
            maxItems: 3,
            type: "food"
        },
        {
            name: "STARTERS",
            maxItems: 3,
            type: "food"
        },
        {
            name: "MAIN COURSE",
            maxItems: 3,
            type: "food"
        },
        {
            name: "INDIAN BREADS",
            maxItems: 3,
            type: "food"
        },
        {
            name: "RICE",
            maxItems: 3,
            type: "food"
        },
        {
            name: "DAL",
            maxItems: 3,
            type: "food"
        },
        {
            name: "FARSAN",
            maxItems: 3,
            type: "food"
        },
        {
            name: "SWEET / ICE CREAM",
            maxItems: 3,
            type: "food"
        },
        {
            name: "RAITA / SALAD",
            maxItems: 3,
            type: "food"
        },
        {
            name: "LIVE COUNTER",
            maxItems: 3,
            type: "food"
        },
        {
            name: "DECORATION",
            maxItems: 1,
            type: "decoration"
        }
    ];
    /* ============================================================
       STATE
    ============================================================ */
    const categoryState = {};
    /* ============================================================
       INITIALISE
    ============================================================ */
    function initialiseChecklist() {
        const body = document.getElementById("checklistBody");
        body.innerHTML = "";
        categories.forEach(category => {
            if (category.type === "decoration") {
                renderDecoration(category);
            } else {
                categoryState[category.name] = 1;
                renderFoodCategory(category);
            }
        });
    }
    /* ============================================================
       RENDER FOOD CATEGORY
    ============================================================ */
    function renderFoodCategory(category) {
        const body = document.getElementById("checklistBody");
        const tr = document.createElement("tr");
        tr.dataset.category = category.name;
        tr.innerHTML = `
            <td class="category">
                ${formatCategoryName(category.name)}
            </td>
            <td class="details-cell">
                <div
                    class="items-container"
                    id="items-${slugify(category.name)}"
                ></div>
                <div class="add-item-row no-print">
                    <button
                        type="button"
                        class="btn btn-outline-dark btn-sm add-item-btn"
                        onclick="addItem('${escapeJs(category.name)}')"
                    >
                        + Add Item
                    </button>
                    <span class="max-note">
                        Maximum ${category.maxItems} items
                    </span>
                </div>
            </td>
            <td class="ready-cell">
                <input
                    type="checkbox"
                    class="ready-checkbox"
                    title="Mark category ready"
                >
            </td>
        `;
        body.appendChild(tr);
        renderItems(category);
    }
    /* ============================================================
       RENDER ITEMS
    ============================================================ */
    function renderItems(category) {
        const container = document.getElementById(
            "items-" + slugify(category.name)
        );
        container.innerHTML = "";
        const count = categoryState[category.name];
        for (let i = 1; i <= count; i++) {
            const row = document.createElement("div");
            row.className = "item-row";
            row.innerHTML = `
                <div class="item-number">
                    ${i}
                </div>
                <div class="item-field">
                    <select
                        class="form-select"
                        aria-label="${category.name} item ${i}"
                    >
                        <option value="">
                            Select item...
                        </option>
                        ${buildOptions(
                            menuCatalogue[category.name] || []
                        )}
                    </select>
                </div>
                <div class="item-qty">
                    <input
                        type="number"
                        min="1"
                        class="form-control text-center"
                        placeholder="Qty"
                    >
                </div>
                <div class="item-requirement">
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Things required to make / serve"
                    >
                </div>
                <div class="text-center">
                    ${
                        count > 1
                        ?
                        `
                        <button
                            type="button"
                            class="remove-item"
                            title="Remove item"
                            onclick="removeItem('${escapeJs(category.name)}', ${i})"
                        >
                            ×
                        </button>
                        `
                        :
                        ""
                    }
                </div>
            `;
            container.appendChild(row);
        }
        updateAddButton(category);
    }
    /* ============================================================
       ADD ITEM
    ============================================================ */
    function addItem(categoryName) {
        const category = categories.find(
            item => item.name === categoryName
        );
        if (!category) return;
        if (categoryState[categoryName] >= category.maxItems) {
            alert(
                `${categoryName} can have a maximum of ${category.maxItems} items.`
            );
            return;
        }
        categoryState[categoryName]++;
        renderItems(category);
    }
    /* ============================================================
       REMOVE ITEM
    ============================================================ */
    function removeItem(categoryName, index) {
        if (categoryState[categoryName] <= 1) {
            return;
        }
        categoryState[categoryName]--;
        renderItems(
            categories.find(
                category => category.name === categoryName
            )
        );
    }
    /* ============================================================
       ADD BUTTON STATE
    ============================================================ */
    function updateAddButton(category) {
        const row = document.querySelector(
            `[data-category="${CSS.escape(category.name)}"]`
        );
        if (!row) return;
        const button = row.querySelector(".add-item-btn");
        const note = row.querySelector(".max-note");
        if (!button) return;
        if (categoryState[category.name] >= category.maxItems) {
            button.disabled = true;
            button.innerText = "Maximum Reached";
            if (note) {
                note.innerText = `Maximum ${category.maxItems} items`;
            }
        } else {
            button.disabled = false;
            button.innerText = "+ Add Item";
            if (note) {
                note.innerText =
                    `${categoryState[category.name]} of ${category.maxItems} items`;
            }
        }
    }
    /* ============================================================
       DECORATION
    ============================================================ */
    function renderDecoration(category) {
        const body = document.getElementById("checklistBody");
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="category">
                DECORATION
            </td>
            <td class="decoration-cell">
                <textarea
                    class="form-control decoration-textarea"
                    placeholder="Enter decoration requirements...
Example:
• Stage backdrop
• Welcome board
• Floral decoration
• Table centrepieces
• Entrance decoration
• Balloon decoration
• LED / name board
• Lighting
• Photo booth
• Any special client requirement"
                ></textarea>
            <div class="decoration-help">
                Enter all decoration requirements, materials,
                quantities and special instructions.
            </div>
        </td>
        <td class="ready-cell">
            <input
                type="checkbox"
                class="ready-checkbox"
                title="Mark decoration ready"
            >
        </td>
    `;
    body.appendChild(tr);
}
/* ============================================================
   BUILD DROPDOWN OPTIONS
============================================================ */
function buildOptions(items) {
    return items
        .map(item => {
            const safe = escapeHtml(item);
            return `
                <option value="${safe}">
                    ${safe}
                </option>
            `;
        })
        .join("");
}
/* ============================================================
   HELPERS
============================================================ */
function slugify(value) {
    return value
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}
function formatCategoryName(value) {
    return value
        .replace(" ", "<br>");
}
function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
function escapeJs(value) {
    return value
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}
/* ============================================================
   RESET
============================================================ */
function resetChecklist() {
    if (!confirm("Reset the complete checklist?")) {
        return;
    }
    categories.forEach(category => {
        if (category.type === "food") {
            categoryState[category.name] = 1;
        }
    });
    initialiseChecklist();
}
/* ============================================================
   START
============================================================ */
document.addEventListener(
    "DOMContentLoaded",
    initialiseChecklist
);
</script>
</body>
</html>
